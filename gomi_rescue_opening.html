<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>ゴミレスキュークエスト｜オープニング</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゴミレスキュー">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ffb300; --purple:#7653c8; --purpled:#4a287d; --ink:#2a3a4a;
  --blue:#2a72d4; --teal:#0f8f83; --green:#2ecc71;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;color:var(--ink);
  background:#000;}
body{display:flex;align-items:center;justify-content:center;}

#stage{width:100%;max-width:460px;height:100%;max-height:900px;position:relative;overflow:hidden;
  background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5);}
@media(min-width:521px){#stage{border-radius:28px;height:92vh;}}

video{width:100%;height:100%;object-fit:cover;display:block;background:#000;}

/* ===== overlay controls ===== */
.top-row{position:absolute;top:max(env(safe-area-inset-top),14px);left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:0 12px;z-index:35;}
.top-left,.top-right{display:flex;align-items:flex-start;gap:7px;min-width:0;}
.lang-select,.toddler-btn{background:rgba(0,0,0,.48);color:#fff;border:1.5px solid rgba(255,255,255,.65);
  border-radius:40px;padding:8px 10px;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;
  font-size:11px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px);max-width:124px;}
.lang-select{appearance:auto;padding-right:7px;}
.lang-select option{background:#fff;color:#18251f;}
.toddler-btn[aria-pressed='true']{background:rgba(57,155,74,.88);border-color:#c9ffb0;}
.toddler-btn:disabled{opacity:.76;cursor:default;}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media(max-width:360px){.top-row{padding:0 8px;gap:4px}.top-left,.top-right{gap:4px}.lang-select,.toddler-btn{font-size:10px;padding:7px 7px;max-width:112px}.skip-btn{font-size:10px;padding:7px 8px;gap:3px;}}
.skip-btn{background:rgba(0,0,0,.45);color:#fff;border:1.5px solid rgba(255,255,255,.6);
  border-radius:40px;padding:8px 16px;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;
  font-size:12.5px;font-weight:700;cursor:pointer;letter-spacing:.03em;
  display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px);}
.skip-btn:active{transform:scale(.95);}

/* tap-to-start sound overlay (needed for autoplay-with-audio on iOS/Chrome) */
.sound-gate{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#173a34,#0b201c 75%);
  color:#fff;text-align:center;padding:0 30px;}
.sound-gate.hidden{display:none;}
.sg-emoji{font-size:56px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
.sg-emoji{display:flex;gap:14px;align-items:center;justify-content:center;}
.sg-emoji img{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
.sg-title{font-family:'Fredoka One',sans-serif;font-size:20px;color:#c9ffb0;line-height:1.5;
  text-shadow:0 2px 0 rgba(0,0,0,.3);}
.sg-sub{font-size:12px;font-weight:700;color:#dff7ea;opacity:.85;line-height:1.8;}
.sg-btn{margin-top:6px;background:linear-gradient(135deg,#5edd7a,var(--green));color:#fff;
  border:none;border-radius:40px;padding:15px 38px;font-family:'Fredoka One',sans-serif;
  font-size:16px;cursor:pointer;box-shadow:0 5px 0 #1f9c53;}
.sg-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1f9c53;}
.sg-skip{margin-top:14px;background:transparent;color:#dff7ea;border:none;
  font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;font-size:12.5px;font-weight:700;
  text-decoration:underline;opacity:.8;cursor:pointer;padding:6px 10px;}
.sg-skip:active{opacity:.5;}

/* progress bar along the bottom */
.progress-wrap{position:absolute;left:14px;right:14px;bottom:max(env(safe-area-inset-bottom),16px);
  z-index:20;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#5edd7a,var(--green));
  border-radius:4px;transition:width .1s linear;}

/* fade-to-white transition before moving to the start page */
.fade-out{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;
  transition:opacity .6s ease;}
.fade-out.active{opacity:1;}
</style>
<style id="mud-accessibility-and-type">
html,body{font-family:'BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP','Yu Gothic',sans-serif}
:where(a,button,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #17152b!important;outline-offset:3px!important;box-shadow:0 0 0 5px #fff!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
:where(small,.hero-copy,.sc-desc,.sc-status,.loc-hint,.reg-note,.stat-cat,.recap-title,.rc-name .t,.rc-score small,.rank-name .t,.rank-score small,.hint,.stage-badge){font-size:max(12px,1em)!important}
:where(.loc-section-label,.loc-block-num,.btn-reset,.rc-empty,.rank-empty,.detail-empty,.btn-home-text,.skip-btn,.sg-skip){font-size:max(12px,1em)!important}
#scr-game .hud-chip .l{font-size:max(12px,1em)!important}#scr-game .hud-chip .v{font-size:clamp(17px,3.6vh,24px)!important}
button,a[role="button"]{touch-action:manipulation}
</style>
</head>
<body>
<div id="stage">

  <!-- 動画を差し替えたら ?v= の数字を変える（ブラウザ/GitHub Pagesのキャッシュで古い動画が再生されるのを防ぐ） -->
  <video id="opening-video" playsinline webkit-playsinline muted preload="auto">
    <source src="assets/opening.mp4?v=20261021" type="video/mp4" onerror="window.__srcFailed=true;if(window.__onSrcFail)window.__onSrcFail()">
  </video>

  <div class="sound-gate" id="sound-gate">
    <div class="sg-emoji"><img src="assets/logo-battery.png?v=20261025" alt="" onerror="this.replaceWith(document.createTextNode('🔋'))"><img src="assets/logo-globe.png?v=20261025" alt="" onerror="this.replaceWith(document.createTextNode('🌍'))"></div>
    <div class="sg-title" id="sg-title">ゴミレスキュー<br>クエスト</div>
    <div class="sg-sub" id="sg-sub">音を鳴らして<br>物語をはじめよう</div>
    <button class="sg-btn" id="btn-start-sound">▶ はじめる</button>
    <button class="sg-skip" id="btn-skip-gate">スキップする ▶</button>
  </div>

  <div class="top-row">
    <div class="top-left">
      <button class="toddler-btn" id="toddler-toggle" type="button" aria-pressed="false">幼児用（ようじ）</button>
    </div>
    <div class="top-right">
      <label class="visually-hidden" for="language-select" id="language-label">言語</label>
      <select class="lang-select" id="language-select" aria-label="言語">
        <option value="ja">日本語</option><option value="en">English</option><option value="zh">中文</option><option value="ko">한국어</option>
      </select>
      <button class="skip-btn" id="btn-skip">スキップ ▶</button>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

  <div class="fade-out" id="fade-out"></div>

</div>

<script>
const video=document.getElementById('opening-video');
const gate=document.getElementById('sound-gate');
const btnStart=document.getElementById('btn-start-sound');
const btnSkip=document.getElementById('btn-skip');
const btnSkipGate=document.getElementById('btn-skip-gate');
const progressBar=document.getElementById('progress-bar');
const fadeOut=document.getElementById('fade-out');
const languageSelect=document.getElementById('language-select');
const toddlerToggle=document.getElementById('toddler-toggle');
const strings={
 ja:{title:'ゴミレスキュー<br>クエスト',sub:'音を鳴らして<br>物語をはじめよう',start:'▶ はじめる',skip:'スキップ ▶',skipGate:'スキップする ▶',toddler:'幼児用（ようじ）',toddlerOn:'幼児用（ひらがな）',toddlerOnly:'幼児用（日本語のみ）',language:'言語',docTitle:'ゴミレスキュークエスト｜オープニング'},
 en:{title:'Gomi Rescue<br>Quest',sub:'Turn on the sound<br>and begin the story',start:'▶ Start with sound',skip:'Skip ▶',skipGate:'Skip intro ▶',toddler:'Child mode (Japanese only)',toddlerOn:'Child mode (Japanese only)',toddlerOnly:'Child mode (Japanese only)',language:'Language',docTitle:'Gomi Rescue Quest | Opening'},
 zh:{title:'垃圾救援<br>任务',sub:'打开声音<br>开始故事吧',start:'▶ 开始并播放声音',skip:'跳过 ▶',skipGate:'跳过开场 ▶',toddler:'幼儿模式（仅日语）',toddlerOn:'幼儿模式（仅日语）',toddlerOnly:'幼儿模式（仅日语）',language:'语言',docTitle:'垃圾救援任务｜开场'},
 ko:{title:'고미 구조<br>퀘스트',sub:'소리를 켜고<br>이야기를 시작해요',start:'▶ 소리와 함께 시작',skip:'건너뛰기 ▶',skipGate:'오프닝 건너뛰기 ▶',toddler:'유아 모드 (일본어만)',toddlerOn:'유아 모드 (일본어만)',toddlerOnly:'유아 모드 (일본어만)',language:'언어',docTitle:'고미 구조 퀘스트 | 오프닝'},
 ja_child:{title:'ごみれすきゅー<br>くえすと',sub:'おとを だして<br>おはなしを はじめよう',start:'▶ おとを だして はじめる',skip:'とばす ▶',skipGate:'おはなしを とばす ▶',toddler:'ようじよう',toddlerOn:'ようじよう（ひらがな）',toddlerOnly:'ようじよう（にほんごのみ）',language:'ことば',docTitle:'ごみれすきゅーくえすと｜おーぷんにんぐ'}
};
const params=new URLSearchParams(location.search);
let storedLang='',savedToddler=false;try{storedLang=localStorage.getItem('grq_language')||'';savedToddler=localStorage.getItem('grq_toddler')==='1';}catch(e){}
let grqLang=params.get('lang')||storedLang||'ja';
if(!['ja','en','zh','ko'].includes(grqLang))grqLang='ja';
let grqToddler=params.get('toddler')==='1'||savedToddler;
const SEEN_KEY='grq_opening_seen';
function persistSettings(){try{localStorage.setItem('grq_language',grqLang);localStorage.setItem('grq_toddler',grqToddler?'1':'0');}catch(e){}}
function renderControls(){
 const childEdition=grqLang==='ja'&&grqToddler;
 const copy=childEdition?strings.ja_child:strings[grqLang];
 document.documentElement.lang=grqLang==='zh'?'zh-CN':grqLang;
 document.title=copy.docTitle;
 document.getElementById('sg-title').innerHTML=copy.title;
 document.getElementById('sg-sub').innerHTML=copy.sub;
 btnStart.textContent=copy.start;btnSkip.textContent=copy.skip;btnSkipGate.textContent=copy.skipGate;
 toddlerToggle.textContent=grqLang==='ja'?(grqToddler?strings.ja.toddlerOn:strings.ja.toddler):copy.toddlerOnly;
 toddlerToggle.disabled=grqLang!=='ja';toddlerToggle.setAttribute('aria-pressed',String(grqLang==='ja'&&grqToddler));
 languageSelect.value=grqLang;languageSelect.setAttribute('aria-label',copy.language);
 document.getElementById('language-label').textContent=copy.language;
}
function nextPage(){return 'gomi_rescue_start.html?lang='+encodeURIComponent(grqLang)+(grqToddler?'&toddler=1':'');}
function markSeen(){try{localStorage.setItem(SEEN_KEY,'true');}catch(e){}}
function goNext(){
 markSeen();fadeOut.classList.add('active');const target=nextPage();
 setTimeout(()=>{location.href=target;},550);setTimeout(()=>{location.href=target;},2000);
}
languageSelect.addEventListener('change',()=>{grqLang=languageSelect.value;if(grqLang!=='ja')grqToddler=false;persistSettings();renderControls();});
toddlerToggle.addEventListener('click',()=>{if(grqLang!=='ja')return;grqToddler=!grqToddler;persistSettings();renderControls();});
video.play().catch(()=>{});
btnStart.addEventListener('click',()=>{gate.classList.add('hidden');video.muted=false;video.currentTime=0;video.play().catch(()=>{video.muted=true;video.play().catch(()=>{});});});
btnSkip.addEventListener('click',goNext);btnSkipGate.addEventListener('click',goNext);
video.addEventListener('timeupdate',()=>{if(!video.duration)return;progressBar.style.width=(video.currentTime/video.duration*100)+'%';});
video.addEventListener('ended',goNext);
let failed=false;
function onVideoFail(){if(failed)return;failed=true;setTimeout(goNext,800);}
window.__onSrcFail=onVideoFail;video.addEventListener('error',onVideoFail);if(window.__srcFailed)onVideoFail();
persistSettings();renderControls();
</script>
</body>
</html>
