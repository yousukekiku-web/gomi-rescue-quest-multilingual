<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>Gomi Rescue Quest | Collection Spot Ranking Registration</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gomi Rescue Quest | Register a Collection Spot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ffb300; --purple:#7653c8; --purpled:#4a287d; --ink:#2a3a4a;
  --blue:#2a72d4; --teal:#0f8f83; --green:#2ecc71;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;color:var(--ink);}
body{background:linear-gradient(160deg,#173a34,#0f8f83);display:flex;align-items:center;justify-content:center;}

#app{width:100%;max-width:460px;height:100%;max-height:900px;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.3);}
@media(min-width:521px){#app{border-radius:28px;height:92vh;}}

.home-link{position:fixed;top:max(env(safe-area-inset-top),10px);left:12px;z-index:999;
  width:44px;height:44px;border-radius:50%;background:#fff;border:none;
  font-size:17px;box-shadow:0 0 0 2px #17302c,0 3px 10px rgba(0,0,0,.25);cursor:pointer;display:flex;
  align-items:center;justify-content:center;text-decoration:none;color:inherit;}
.home-link:active{transform:scale(.9);}

/* ===== incomplete notice ===== */
.notice{padding:40px 24px;text-align:center;}
.notice .em{font-size:52px;margin-bottom:10px;}
.notice h2{font-family:'BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP','Yu Gothic',sans-serif;font-weight:700;font-size:20px;color:var(--purpled);margin-bottom:10px;}
.notice p{font-size:12.5px;font-weight:700;color:#5a5570;line-height:1.8;margin-bottom:20px;}
.notice a{display:inline-block;background:#5b3aa8;color:#fff;
  text-decoration:none;font-family:'Noto Sans JP','BIZ UDPGothic',sans-serif;font-weight:900;font-size:16px;padding:14px 32px;border-radius:40px;
  box-shadow:0 0 0 2px #2e1a63,0 5px 0 2px #2e1a63;}

/* ===== hero ===== */
.hero{background:linear-gradient(160deg,#173a34,#0f8f83);color:#fff;text-align:center;
  padding:max(env(safe-area-inset-top),26px) 22px 22px;}
.hero-emoji{font-size:42px;}
.hero-title{font-family:'BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP','Yu Gothic',sans-serif;font-weight:700;font-size:19px;color:#c9ffb0;margin:4px 0 8px;
  text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1.4;}
.hero-copy{font-size:11.5px;font-weight:700;line-height:1.8;color:#e2fff0;max-width:360px;margin:0 auto;}

/* ===== my character recap chip ===== */
.me-chip{margin:14px 18px 0;display:flex;align-items:center;gap:10px;background:#f6f0ff;border-radius:16px;
  padding:10px 14px;text-decoration:none;color:inherit;box-shadow:0 2px 8px rgba(60,30,110,.1);}
.me-chip .mc-icon{width:42px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;
  border-radius:9px;overflow:hidden;}
.me-chip .mc-icon img{width:100%;height:100%;object-fit:cover;display:block;}
.me-chip .mc-body{flex:1;min-width:0;}
.me-chip .mc-label{font-size:9px;font-weight:900;color:#6a4fa0;letter-spacing:.05em;}
.me-chip .mc-title{font-size:12.5px;font-weight:900;color:var(--purpled);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.me-chip .mc-arrow{font-size:12px;font-weight:900;color:#fff;background:#5b3aa8;border-radius:20px;padding:8px 12px;flex-shrink:0;
  white-space:nowrap;box-shadow:0 0 0 2px #2e1a63,0 3px 0 2px #2e1a63;}

/* ===== register ===== */
.register{margin:16px 18px;background:#f0faf3;border:2px dashed #a8e6b8;border-radius:16px;padding:16px;text-align:center;}
.register h3{font-family:'BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP','Yu Gothic',sans-serif;font-weight:700;font-size:16px;color:#0b6b5f;margin-bottom:8px;}
.register p{font-size:11px;font-weight:700;color:#1f4d36;margin-bottom:12px;line-height:1.6;}
.register input{width:100%;padding:11px 14px;border-radius:12px;border:2px solid #b8e8c4;font-size:14px;
  font-weight:700;margin-bottom:10px;text-align:center;background:#fff;color:var(--ink);}
.register input:focus{outline:none;border-color:var(--green);}
/* 色覚多様性対応：色ベタ＋白抜き文字（濃い背景に白文字でコントラスト比 約6:1）。色に頼らず明暗と形で目立たせる */
.jbrc-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:'Noto Sans JP','BIZ UDPGothic',sans-serif;font-weight:900;font-size:15px;color:#fff;
  background:#1d5bb8;border:3px solid #fff;border-radius:16px;padding:13px 10px;margin:4px 0 14px;
  text-decoration:none;line-height:1.4;text-align:center;
  box-shadow:0 0 0 2px #14336b,0 5px 0 2px #14336b;}
.jbrc-link:active{transform:translateY(3px);box-shadow:0 0 0 2px #14336b,0 2px 0 2px #14336b;}
.jbrc-link .jl-main{display:flex;align-items:center;justify-content:center;gap:8px;}
.jbrc-link .jl-main .gi{flex:none;width:30px;height:30px;padding:4px;background:#fff;border-radius:50%;}
.jbrc-link .jl-sub{font-family:'BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP',sans-serif;font-size:12px;font-weight:700;opacity:1;}
.loc-row{display:flex;gap:8px;margin-bottom:12px;}
.loc-row select{flex:1;padding:11px 8px;border-radius:12px;border:2px solid #b8e8c4;font-size:12.5px;
  font-weight:700;background:#fff;color:var(--ink);}
.loc-row input{flex:1;margin-bottom:0;}
.loc-row select:focus{outline:none;border-color:var(--green);}
.loc-section-label{font-size:11px;font-weight:900;color:#1f4d36;text-align:left;margin-bottom:8px;line-height:1.6;}
.loc-block{background:#fff;border:2px solid #cdeed7;border-radius:14px;padding:12px;margin-bottom:10px;text-align:left;}
.loc-block-num{display:inline-block;font-family:'BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP','Yu Gothic',sans-serif;font-weight:900;font-size:11px;color:#0a5a2e;
  background:#dff5e1;border-radius:8px;padding:2px 9px;margin-bottom:8px;}
.loc-block .loc-row{margin-bottom:8px;}
.loc-block input.place-input{margin-bottom:0;text-align:left;font-size:12.5px;}
.loc-hint{font-size:9.5px;font-weight:700;color:#2f5f45;margin:-2px 0 12px;line-height:1.6;text-align:left;}
.btn-register{width:100%;padding:17px 12px;border:3px solid #fff;border-radius:40px;background:#0b6b5f;
  color:#fff;font-family:'Noto Sans JP','BIZ UDPGothic',sans-serif;font-weight:900;font-size:19px;letter-spacing:.06em;
  cursor:pointer;box-shadow:0 0 0 2px #063d36,0 6px 0 2px #063d36;}
.btn-register:active{transform:translateY(4px);box-shadow:0 0 0 2px #063d36,0 2px 0 2px #063d36;}
/* 登録中は薄くせず、濃いグレー＋白文字のまま読めるようにする */
.btn-register:disabled{opacity:1;background:#55606b;box-shadow:0 0 0 2px #2f3740,0 6px 0 2px #2f3740;cursor:default;}
.register input::placeholder{color:#55665d;opacity:1;font-weight:700;}
.reg-note{font-size:9.5px;font-weight:700;color:#2f5f45;margin-top:8px;line-height:1.6;}

/* ===== ranking ===== */
.ranking{margin:18px 18px 8px;}
.ranking-title{font-family:'BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP','Yu Gothic',sans-serif;font-weight:700;font-size:17px;color:var(--purpled);text-align:center;margin-bottom:10px;}
.rank-list{display:flex;flex-direction:column;gap:7px;}
.rank-item{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:12px;padding:10px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);}
.rank-item.me{background:#eafcf0;border:2px solid var(--green);}
.rank-top{display:flex;align-items:center;gap:10px;}
.rank-pos{font-family:'Fredoka One','BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP',sans-serif;font-weight:400;font-size:15px;width:26px;text-align:center;color:#6a4fa0;flex-shrink:0;}
.rank-pos.medal{font-size:19px;}
.rank-char-icon{width:34px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;
  border-radius:8px;overflow:hidden;}
.rank-char-icon img{width:100%;height:100%;object-fit:cover;display:block;}
.rank-name{flex:1;min-width:0;}
.rank-name .n{font-size:12.5px;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-name .t{font-size:9.5px;font-weight:700;color:#5a5570;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-score{font-family:'Fredoka One','BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP',sans-serif;font-weight:400;font-size:13px;color:#1b7a45;letter-spacing:.05em;flex-shrink:0;}
.rank-chars{display:flex;gap:5px;flex-wrap:wrap;padding-left:44px;}
.rank-char-badge{display:flex;align-items:center;gap:3px;background:#e2f9ec;border-radius:8px;padding:3px 7px;
  font-size:9.5px;font-weight:700;color:#14693a;}
.rank-empty{text-align:center;font-size:11.5px;color:#6a5a88;font-weight:700;padding:16px;}

.btn-view-board{display:block;text-align:center;background:#ffc61a;border:3px solid #fff;
  color:#2b1a00;text-decoration:none;font-family:'Noto Sans JP','BIZ UDPGothic',sans-serif;font-weight:900;font-size:15.5px;line-height:1.5;
  padding:14px 14px;border-radius:18px;box-shadow:0 0 0 2px #5a3a00,0 5px 0 2px #5a3a00;}
.btn-view-board:active{transform:translateY(3px);box-shadow:0 0 0 2px #5a3a00,0 2px 0 2px #5a3a00;}
.btn-view-board .ti-wrap{width:30px;height:30px;margin-right:8px;vertical-align:middle;box-shadow:0 0 0 2px #5a3a00;}
.btn-view-board .ti-wrap img{width:20px;height:20px;}
.btn-view-board .vb-text{display:inline-block;vertical-align:middle;text-wrap:balance;}
.btn-view-board small{display:block;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;font-size:12px!important;
  font-weight:700;margin-top:4px;opacity:1;color:#3b2600;text-wrap:balance;}

.retry-row{padding:16px 18px 30px;display:flex;flex-direction:column;gap:10px;}
.btn-retry-all{width:100%;padding:15px;border:none;border-radius:40px;background:#5b3aa8;
  color:#fff;font-family:'Noto Sans JP','BIZ UDPGothic',sans-serif;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 0 0 2px #2e1a63,0 5px 0 2px #2e1a63;}
.btn-retry-all .gi{width:1.7em;height:1.7em;padding:3px;background:#fff;border-radius:50%;vertical-align:middle;margin-right:6px;}
.btn-retry-all:active{transform:translateY(3px);box-shadow:0 0 0 2px #2e1a63,0 2px 0 2px #2e1a63;}
.gi{width:1.15em;height:1.15em;vertical-align:-.22em;display:inline-block;flex-shrink:0;}
.home-link .gi,.bgm-btn .gi,.refresh-btn .gi{width:24px;height:24px;vertical-align:0;}
.notice .em .gi{width:52px;height:52px;vertical-align:0;}
.hero-emoji{display:flex;gap:10px;align-items:center;justify-content:center;}
.hero-emoji img,.hero-emoji .gi{width:46px;height:46px;object-fit:contain;vertical-align:0;}
.ti{width:22px;height:22px;object-fit:contain;vertical-align:-5px;margin-right:4px;}
.ti-wrap{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#fff;align-items:center;justify-content:center;margin-right:6px;vertical-align:-7px;}
.ti-wrap img{width:18px;height:18px;object-fit:contain;display:block;}
.jbrc-link .gi{width:1.2em;height:1.2em;}
</style>
<style id="mud-accessibility-and-type">
html,body{font-family:'BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP','Yu Gothic',sans-serif}
:where(a,button,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #17152b!important;outline-offset:3px!important;box-shadow:0 0 0 5px #fff!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
:where(small,.hero-copy,.sc-desc,.sc-status,.loc-hint,.reg-note,.stat-cat,.recap-title,.rc-name .t,.rc-score small,.rank-name .t,.rank-score small,.hint,.stage-badge){font-size:max(12px,1em)!important}
:where(.loc-section-label,.loc-block-num,.btn-reset,.rc-empty,.rank-empty,.detail-empty,.btn-home-text,.skip-btn,.sg-skip){font-size:max(12px,1em)!important}
#scr-game .hud-chip .l{font-size:max(12px,1em)!important}#scr-game .hud-chip .v{font-size:clamp(17px,3.6vh,24px)!important}
button,a[role="button"]{touch-action:manipulation}
button,input,select,textarea{font-family:inherit}
</style>
</head>

function rollCharacterVariant(tierIndex, fingerprint){
  try{
    const saved = JSON.parse(localStorage.getItem('grq_char_roll') || 'null');
    if(saved && saved.fp === fingerprint) return saved;
  }catch(e){}
  let variantId = null, rareId = null;
  if(tierIndex === 5){
    const roll = Math.floor(Math.random()*30);
    if(roll < 3){ rareId = RARE_CHARACTERS[roll].id; }
    else{ variantId = pickRandom(TIER_VARIANTS[5]).id; }
  } else {
    variantId = pickRandom(TIER_VARIANTS[tierIndex]).id;
  }
  const result = {fp: fingerprint, tierIndex, variantId, rareId};
  try{ localStorage.setItem('grq_char_roll', JSON.stringify(result)); }catch(e){}
  return result;
}

async function storageAvailable(){
  return typeof window.storage !== 'undefined' && window.storage;
}
async function loadRanking(){
  try{
    if(await storageAvailable()){
      const res = await window.storage.get('grq_ranking', true);
      return res ? JSON.parse(res.value) : [];
    }
  }catch(e){}
  try{ return JSON.parse(localStorage.getItem('grq_ranking_local') || '[]'); }
  catch(e){ return []; }
}
async function saveRanking(list){

}

 (function(){const im=new Image();im.onload=()=>{const el=document.getElementById('me-chip-icon');if(el)el.innerHTML=`<img src="chars/${imgKey}.png" alt="">`;};im.src=`chars/${imgKey}.png`;})();
 document.getElementById('btn-register').addEventListener('click',async()=>{
  const nameInput=document.getElementById('reg-name'),note=document.getElementById('reg-note'),name=nameInput.value.trim();
  const blocks=[1,2,3].map(n=>({prefecture:document.getElementById('reg-pref-'+n).value,city:document.getElementById('reg-city-'+n).value.trim(),place:document.getElementById('reg-place-'+n).value.trim()}));
  if(!name){note.textContent=t.nameError;note.style.color='#ff5a4d';return;}
  if(!blocks[0].prefecture||!blocks[0].city){note.textContent=t.spot1Error;note.style.color='#ff5a4d';return;}
  for(let i=1;i<3;i++){const b=blocks[i],hasAny=b.prefecture||b.city||b.place;if(hasAny&&(!b.prefecture||!b.city)){note.textContent=t.spotNError.replace('{n}',String(i+1));note.style.color='#ff5a4d';return;}}
  const locations=blocks.filter(b=>b.prefecture&&b.city).slice(0,3),btn=document.getElementById('btn-register');btn.disabled=true;btn.textContent=t.saving;
  const entry={name:name.slice(0,12),code,tier:cardTitle,tierEmoji:cardEmoji,imgKey,rare:!!rare,locations:locations.map(l=>({prefecture:l.prefecture,city:l.city.slice(0,20),place:l.place.slice(0,30)})),totalScore:sum*1000+(s1.score||0)+(s2.found||0)*50+(s3.correct||0)*50,ts:Date.now()};
  const list=await loadRanking();list.push(entry);await saveRanking(list);note.textContent=t.saved;note.style.color='#1f9c53';setTimeout(()=>{location.href=rankingHref+'?ts='+entry.ts;},700);
 });
 document.getElementById('btn-restart').addEventListener('click',()=>{if(confirm(t.confirm)){try{localStorage.removeItem('grq_progress');}catch(e){}location.href=homeHref;}});
}
main();

<script id="ranking-a11y">(()=>{const ids=["reg-name", "reg-pref-1", "reg-city-1", "reg-place-1", "reg-pref-2", "reg-city-2", "reg-place-2", "reg-pref-3", "reg-city-3", "reg-place-3"],labels=["Name (required, max 12 characters)", "Collection spot 1 prefecture (required)", "Collection spot 1 city or ward (required)", "Collection spot 1 store/place name (optional)", "Collection spot 2 prefecture (optional)", "Collection spot 2 city or ward (optional)", "Collection spot 2 store/place name (optional)", "Collection spot 3 prefecture (optional)", "Collection spot 3 city or ward (optional)", "Collection spot 3 store/place name (optional)"];ids.forEach((id,i)=>{const e=document.getElementById(id);if(e){e.setAttribute('aria-label',labels[i]);e.setAttribute('title',labels[i])}});document.getElementById('reg-note')?.setAttribute('aria-live','polite')})();</script>
